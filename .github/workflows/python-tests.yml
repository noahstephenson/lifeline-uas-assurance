name: Python tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --cov=lifeline --cov-report=term-missing
      - run: lifeline validate
      - name: Parse PowerShell launchers
        shell: pwsh
        run: ./scripts/test-powershell-syntax.ps1
