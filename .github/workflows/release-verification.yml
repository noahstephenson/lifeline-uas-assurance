name: Strict release verification
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/verify_release_export.py
      - run: python scripts/build_release_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: project-lifeline-v1.1.0-evidence
          path: |
            dist/lifeline-evidence-v1.1.0.zip
            dist/SHA256SUMS
