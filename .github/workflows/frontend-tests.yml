name: Open MCT build
on:
  push:
    paths: ["openmct/**", ".github/workflows/frontend-tests.yml"]
  pull_request:
    paths: ["openmct/**", ".github/workflows/frontend-tests.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openmct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: openmct/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Lifeline API
        run: python -m pip install -e .
        working-directory: .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:qualification
      - run: npm run build
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automated-display-qualification
          path: |
            evidence/display-qualification/display-qualification.json
            evidence/display-qualification/screenshots
