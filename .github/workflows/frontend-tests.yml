name: Open MCT build
on:
  push:
    paths: ["openmct/**", ".github/workflows/frontend-tests.yml"]
  pull_request:
    paths: ["openmct/**", ".github/workflows/frontend-tests.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openmct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: openmct/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
